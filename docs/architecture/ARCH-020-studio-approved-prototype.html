<style>
#commerce-studio-visual{--st-bg:light-dark(#f7f8f8,#141c1c);--st-panel:light-dark(#ffffff,#1b2525);--st-side:light-dark(#eef3f1,#182222);--st-text:light-dark(#203432,#e5efeb);--st-sub:light-dark(#647671,#a6b9b2);--st-line:light-dark(#dce6e1,#344540);--st-accent:light-dark(#236251,#98d7bf);--st-accent-ink:light-dark(#ffffff,#142a22);--st-soft:light-dark(#e8f3ed,#243d32);--st-warn:light-dark(#895f19,#eac37c);--st-warnbg:light-dark(#fff4df,#3c3322);--st-radius:12px;color:var(--st-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;max-width:100%;color-scheme:light dark}
#commerce-studio-visual *{box-sizing:border-box}
#commerce-studio-visual button,#commerce-studio-visual input,#commerce-studio-visual select,#commerce-studio-visual textarea{font:inherit}
#commerce-studio-visual button{border:1px solid var(--st-line);border-radius:8px;background:var(--st-panel);color:var(--st-text);padding:8px 12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;max-width:100%;white-space:normal}
#commerce-studio-visual button:hover{background:var(--st-soft)}
#commerce-studio-visual button:focus-visible,#commerce-studio-visual input:focus-visible,#commerce-studio-visual textarea:focus-visible,#commerce-studio-visual select:focus-visible{outline:3px solid var(--st-accent);outline-offset:2px}
#commerce-studio-visual button.primary{background:var(--st-accent);color:var(--st-accent-ink);border-color:var(--st-accent)}
#commerce-studio-visual button.link{padding:4px 0;border:0;background:transparent;color:var(--st-accent);justify-content:flex-start;text-align:left}
#commerce-studio-visual button:disabled{opacity:.5;cursor:not-allowed}
#commerce-studio-visual .toprail{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#commerce-studio-visual .toprail .left,#commerce-studio-visual .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#commerce-studio-visual .eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--st-sub);font-weight:500}
#commerce-studio-visual .shell{display:grid;grid-template-columns:185px minmax(0,1fr);border:1px solid var(--st-line);border-radius:16px;overflow:hidden;background:var(--st-bg);min-height:600px}
#commerce-studio-visual aside{background:var(--st-side);padding:24px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--st-line)}
#commerce-studio-visual .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
#commerce-studio-visual .mark{background:var(--st-accent);color:var(--st-accent-ink);border-radius:10px;padding:7px 11px;font-size:20px;font-weight:500}
#commerce-studio-visual nav{display:grid;gap:5px}
#commerce-studio-visual nav button{justify-content:flex-start;border:0;background:transparent;padding:10px;text-align:left}
#commerce-studio-visual nav button.selected{background:var(--st-panel);box-shadow:0 1px 4px light-dark(#16382a12,#00000020);font-weight:500;color:var(--st-accent)}
#commerce-studio-visual .sidefoot{margin-top:auto;padding:12px 8px;border-top:1px solid var(--st-line);font-size:12px;color:var(--st-sub)}
#commerce-studio-visual .workspace{min-width:0}
#commerce-studio-visual .auth-shell{grid-template-columns:1fr}
#commerce-studio-visual .auth-shell aside,#commerce-studio-visual .auth-shell .appbar,#commerce-studio-visual .auth-shell .flowstrip{display:none}
#commerce-studio-visual .appbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:13px 25px;border-bottom:1px solid var(--st-line);background:var(--st-panel)}
#commerce-studio-visual .breadcrumb{font-size:12px;color:var(--st-sub)}
#commerce-studio-visual .profile{display:flex;align-items:center;gap:8px;font-size:12px}
#commerce-studio-visual .avatar{padding:5px 8px;border-radius:50%;background:var(--st-soft);color:var(--st-accent)}
#commerce-studio-visual main{padding:26px;min-width:0}
#commerce-studio-visual h1{font-size:25px;line-height:1.25;font-weight:500;letter-spacing:-.04em;margin:0 0 6px}
#commerce-studio-visual h2{font-size:16px;font-weight:500;margin:0 0 10px}
#commerce-studio-visual h3{font-size:14px;font-weight:500;margin:0 0 8px}
#commerce-studio-visual p{margin:0 0 12px}
#commerce-studio-visual .sub{color:var(--st-sub);font-size:12px}
#commerce-studio-visual .heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
#commerce-studio-visual .heading p{color:var(--st-sub);font-size:13px;max-width:490px;margin:0}
#commerce-studio-visual .panel{background:var(--st-panel);border:1px solid var(--st-line);border-radius:var(--st-radius);padding:20px;min-width:0;margin-bottom:16px}
#commerce-studio-visual .panel.flush{padding:0;overflow:hidden}
#commerce-studio-visual .panelhead{padding:15px 18px;border-bottom:1px solid var(--st-line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#commerce-studio-visual .panelhead h2{margin:0}
#commerce-studio-visual .split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
#commerce-studio-visual .row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--st-line);flex-wrap:wrap}
#commerce-studio-visual .row:last-child{border:0}
#commerce-studio-visual .name{font-weight:500}
#commerce-studio-visual .badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 7px;background:var(--st-side);font-size:11px;white-space:nowrap;color:var(--st-sub)}
#commerce-studio-visual .badge.live{background:var(--st-soft);color:var(--st-accent)}
#commerce-studio-visual .badge.draft{background:var(--st-warnbg);color:var(--st-warn)}
#commerce-studio-visual .badge.inactive{background:var(--st-side);color:var(--st-sub)}
#commerce-studio-visual .notice{background:var(--st-soft);border-radius:8px;padding:12px 14px;font-size:12px;margin:14px 0;color:var(--st-text)}
#commerce-studio-visual .notice.warn{background:var(--st-warnbg)}
#commerce-studio-visual label{display:block;font-size:12px;font-weight:500;margin-bottom:14px}
#commerce-studio-visual input:not([type=checkbox]),#commerce-studio-visual textarea,#commerce-studio-visual select{display:block;width:100%;padding:10px 11px;border:1px solid var(--st-line);border-radius:7px;background:var(--st-panel);color:var(--st-text);margin-top:6px;min-width:0}
#commerce-studio-visual input[type=checkbox]{accent-color:var(--st-accent);margin-right:7px}
#commerce-studio-visual textarea{min-height:90px;resize:vertical}
#commerce-studio-visual .tabs{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--st-line);margin-bottom:20px}
#commerce-studio-visual .tabs button{padding:0 0 11px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--st-sub)}
#commerce-studio-visual .tabs button.active{border-color:var(--st-accent);color:var(--st-text)}
#commerce-studio-visual .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
#commerce-studio-visual .steps button{padding:5px 9px;font-size:11px;background:var(--st-panel)}
#commerce-studio-visual .steps button.active{background:var(--st-accent);color:var(--st-accent-ink)}
#commerce-studio-visual .bottom{border-top:1px solid var(--st-line);padding-top:16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
#commerce-studio-visual pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--st-side);color:var(--st-text);padding:14px;border-radius:8px;font-size:12px}
#commerce-studio-visual .path{font-family:ui-monospace,monospace;font-size:11px;color:var(--st-sub);overflow-wrap:anywhere}
#commerce-studio-visual .pillfields{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
#commerce-studio-visual .pillfields button{font-size:12px;padding:5px 9px;background:var(--st-soft);color:var(--st-accent)}
#commerce-studio-visual .timeline{display:grid;gap:0}
#commerce-studio-visual .timeline .event{display:flex;gap:12px;padding:10px 0}
#commerce-studio-visual .dot{border-radius:50%;background:var(--st-soft);color:var(--st-accent);height:25px;min-width:25px;display:grid;place-items:center;font-size:12px}
#commerce-studio-visual .chat{display:grid;gap:14px;margin-bottom:18px}
#commerce-studio-visual .bubble{max-width:90%;padding:13px 15px;background:var(--st-side);border-radius:12px;font-size:13px}
#commerce-studio-visual .bubble.customer{justify-self:end;background:var(--st-soft)}
#commerce-studio-visual .flowstrip{display:flex;gap:5px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--st-sub);align-items:center}
#commerce-studio-visual .flowstrip button{font-size:11px;padding:4px 7px;background:transparent;border:0;color:var(--st-sub)}
#commerce-studio-visual .flowstrip button.active{background:var(--st-soft);color:var(--st-accent)}
#commerce-studio-visual .map{padding:24px;border:1px solid var(--st-line);background:var(--st-bg);border-radius:16px}
#commerce-studio-visual .lanes{display:grid;gap:20px}
#commerce-studio-visual .lane{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
#commerce-studio-visual .nodes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#commerce-studio-visual .node{display:block;text-align:left;min-width:135px;flex:1;padding:13px}
#commerce-studio-visual .node .sub{display:block;font-size:11px;margin-top:3px}
#commerce-studio-visual .node .path{display:block;margin-top:7px}
#commerce-studio-visual .overlay{position:absolute;inset:0;background:light-dark(#20343266,#00000080);z-index:3;padding:35px 15px;display:flex;align-items:flex-start;justify-content:center;border-radius:16px}
#commerce-studio-visual .dialog{background:var(--st-panel);border:1px solid var(--st-line);border-radius:14px;padding:24px;width:450px;max-width:100%;box-shadow:0 20px 70px light-dark(#14312733,#00000070)}
#commerce-studio-visual .dialog .actions{justify-content:flex-end;margin-top:20px}
#commerce-studio-visual .productframe{position:relative}
#commerce-studio-visual .toast{background:var(--st-soft);color:var(--st-accent);padding:10px 16px;font-size:12px;margin-bottom:12px;border-radius:8px}
#commerce-studio-visual .auth{max-width:400px;margin:45px auto;padding:28px}
#commerce-studio-visual .searchline{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
#commerce-studio-visual .searchline input{margin:0;flex:1;min-width:130px}
#commerce-studio-visual .detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:16px 0}
#commerce-studio-visual table{width:100%;border-collapse:collapse;font-size:12px}
#commerce-studio-visual th,#commerce-studio-visual td{text-align:left;padding:11px;border-bottom:1px solid var(--st-line);overflow-wrap:anywhere}
#commerce-studio-visual th{font-weight:500;color:var(--st-sub)}
#commerce-studio-visual .compact .row{padding-top:10px;padding-bottom:10px}
@media(max-width:740px){#commerce-studio-visual .shell{grid-template-columns:1fr}#commerce-studio-visual aside{padding:14px;border-right:0;border-bottom:1px solid var(--st-line);gap:12px}#commerce-studio-visual nav{display:flex;flex-wrap:wrap;gap:3px}#commerce-studio-visual nav button{font-size:12px;padding:7px}#commerce-studio-visual .sidefoot{display:none}#commerce-studio-visual main{padding:18px}#commerce-studio-visual .split{grid-template-columns:1fr}#commerce-studio-visual .appbar{padding:12px 18px}#commerce-studio-visual .lane{grid-template-columns:1fr}#commerce-studio-visual .heading{gap:10px}#commerce-studio-visual .detailgrid{gap:10px}}
@media(max-width:420px){#commerce-studio-visual .toprail{align-items:flex-start}#commerce-studio-visual .nodes{display:grid;grid-template-columns:1fr}#commerce-studio-visual .nodes>span{display:none}#commerce-studio-visual .detailgrid{grid-template-columns:1fr}#commerce-studio-visual .panel{padding:14px}#commerce-studio-visual h1{font-size:22px}#commerce-studio-visual input,#commerce-studio-visual select,#commerce-studio-visual textarea{font-size:16px!important}#commerce-studio-visual .appbar .profile{display:none}}
</style>
<div id="commerce-studio-visual" aria-label="CommerceAgent Studio interactive design">
 <div class="toprail"><div class="left"><span class="eyebrow">ARCH–020 · Studio walkthrough</span><span class="badge">Sample data · no live changes</span></div><div class="actions"><button type="button" data-action="view-studio" class="primary cursor-interaction">Studio screens</button><button type="button" data-action="view-map" class="cursor-interaction">Page & flow map</button></div></div>
 <div id="studio-visual-body"></div>
 <div id="studio-visual-announcement" aria-live="polite" class="sub"></div>
</div>
<script>
(()=>{
const root=document.getElementById('commerce-studio-visual');
const body=root.querySelector('#studio-visual-body');
const announcer=root.querySelector('#studio-visual-announcement');
const pages={U01:['Sign in','/sign-in'],U02:['Access denied','/access-denied'],U03:['Features','/features'],U04:['Care advice','/features/care-advice'],U05:['Tools','/tools'],U06:['Read product details','/tools/product-details'],U07:['Explore Shopify','/explore'],U08:['Platform configurations','/capabilities'],U09:['Care advice behaviour','/capabilities/care-advice'],U10:['Releases','/releases'],U11:['Release review','/releases/13'],U12:['Merchants','/shops'],U13:['North & Field','/shops/north-and-field'],U14:['Test conversations','/preview']};
const fresh={page:'U03',view:'studio',step:0,featureConfigured:false,toolCreated:true,toolDraft:true,toolPublished:false,attached:false,behaviourPublished:false,releaseCreated:false,activated:false,queryPicked:false,validated:false,previewStarted:false,previewSent:false,previewMode:'Conversation',previewReturn:'U03',feature:'Care advice',tab:'Definition',exploreTab:'Schema and query builder',modal:null,notice:'',dirty:false,toolName:'read_product_details',purpose:'Read product details to answer questions about materials and care. Refer to the store when the answer is not stated.',prompt:'Answer product-care questions using verified product descriptions. If care instructions are not stated, direct the customer to the store.',message:'How should I wash this linen shirt?',toolLabel:'Read product details',template:'{{result.values.title}}: {{result.values.description}}',inputValue:'linen-shirt',returnToBehaviour:false,role:'SUPER_ADMIN',trace:true};
let state={...fresh};
const saved=window.openai?.widgetState?.privateContent;
if(saved?.schema==='studio-v1'&&pages[saved.page]) state={...state,...saved,modal:null,notice:'',dirty:false};
const design={density:'Comfortable',corners:12};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(label,action,primary=false,extra='')=>`<button type="button" class="${primary?'primary ':''}cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
const link=(label,page)=>`<button type="button" class="link cursor-interaction" data-go="${page}">${label}</button>`;
const badge=(text,type='')=>`<span class="badge ${type}">${text}</span>`;
const row=(title,sub,right)=>`<div class="row"><div><div class="name">${title}</div><div class="sub">${sub}</div></div><div class="actions">${right}</div></div>`;
const head=(title,sub,action='')=>`<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${action}</div></div>`;
const tabs=(names,current,kind)=>`<div class="tabs">${names.map(n=>btn(n,kind,false,`data-value="${n}" aria-pressed="${n===current}"`).replace('class="','class="'+(n===current?'active ':''))).join('')}</div>`;
const field=(label,key,value,multiline=false)=>`<label>${label}${multiline?`<textarea data-bind="${key}">${esc(value)}</textarea>`:`<input data-bind="${key}" value="${esc(value)}">`}</label>`;
const notice=(text,warn=false)=>`<div class="notice ${warn?'warn':''}">${text}</div>`;
const primaryFlow=['U04','U09','U06','U07','U14','U10','U11'];
const sessionMarker=String(Date.now())+Math.random().toString(36);
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:pages[state.page][0],page:state.page,view:state.view,toolPublished:state.toolPublished,releaseActivated:state.activated},privateContent:{...state,sessionMarker,schema:'studio-v1',modal:null,notice:'',dirty:false}})?.catch(()=>{});}
function go(page,force=false){if(state.dirty&&!force){state.pendingPage=page;state.modal='unsaved';render();return;}state.page=page;state.view='studio';state.notice='';state.modal=null;render();persist();}
function banner(text){state.notice=text;announcer.textContent=text;}
function pageContent(){
 switch(state.page){
 case'U01':return `<div class="panel auth"><span class="eyebrow">Moda / Commerce Studio</span><h1 style="margin-top:20px">Welcome back</h1><p class="sub">Team access using your existing Admin account.</p>${btn('Continue with Google','sign-in',true)}${notice('Design preview: sign-in is simulated.')}<div style="margin-top:22px">${link('View access-denied state','U02')}</div></div>`;
 case'U02':return `<div class="panel auth">${icon('shield-alert')}<h1>Access denied</h1><p class="sub">This account does not have active Studio access.</p>${btn('Sign out','sign-out')}</div>`;
 case'U03':return head('Features','Configure how existing Admin features behave in customer conversations.',link('Platform configurations','U08'))+`<div class="searchline"><input aria-label="Search features" placeholder="Search features" data-search="features"><span class="badge">Owned by Admin</span></div><div class="panel flush" data-list="features">${row(btn('Product guidance','feature-product'),'product_guidance · Merchant opt-in',badge('Live','live')+btn('Configure behaviour','feature-product'))}${row(link('Care advice','U04'),'care_advice · Merchant opt-in',badge(state.activated?'Live':state.featureConfigured?'Draft only':'Not configured',state.activated?'live':state.featureConfigured?'draft':'')+btn('Configure behaviour','feature-care',true))}${row(btn('Size information','feature-size'),'size_information · Merchant opt-in',badge('Draft only','draft')+btn('Configure behaviour','feature-size'))}</div>${notice('Feature names, plan availability and activation modes are managed in Admin. Studio defines the agent’s behaviour and tools.')}`;
 case'U04':return link('← Back to Features','U03')+head(esc(state.feature),'Configure instructions and tools for this existing feature.',btn('Manage feature in Admin','admin-info'))+`<div class="panel"><div class="actions">${badge('Active in Admin','live')}${badge('Merchant opt-in')}</div><div class="detailgrid"><div class="sub">Feature key<div class="name path">${state.feature.toLowerCase().replaceAll(' ','_')}</div></div><div class="sub">Commerce status<div style="margin-top:5px">${badge(state.activated?'Live':state.featureConfigured?'Draft only':'Not configured',state.activated?'live':'draft')}</div></div></div></div><div class="panel flush"><div class="panelhead"><h2>Agent behaviour</h2>${btn('Add behaviour','add-behaviour',!state.featureConfigured)}</div>${state.featureConfigured?row(link(esc(state.feature)+' assistant','U09'),'Draft revision 2 · 1 published revision',badge(state.behaviourPublished?'Published':'Draft',state.behaviourPublished?'live':'draft')+link('Open →','U09')):`<div style="padding:28px"><h2>No behaviour configured yet</h2><p class="sub">Add instructions, then associate the tools the agent can use.</p>${btn('Configure behaviour','add-behaviour',true)}</div>`}</div>`;
 case'U05':return head('Tools','All reusable tools. Each merchant’s agent receives only its eligible published tools.',btn('+ New tool','new-tool',true))+notice('Looking for the list an agent receives? '+link('Inspect a merchant’s tool list →','U12'))+`<div class="searchline"><input aria-label="Search tools" placeholder="Search tools" data-search="tools"><span class="sub">Published tools can be shared across features</span></div><div class="panel flush" data-list="tools">${row(link(esc(state.toolLabel),'U06'),esc(state.toolName),badge(state.toolPublished?'Published 1.0.0':'Draft 1.0.0',state.toolPublished?'live':'draft')+link('Open →','U06'))}${row('Read recovery basket','Trusted recovery information',badge('Published 1.0.0','live')+btn('Inspect','inspect-basket'))}${row('Evaluate available offer','Discount policy and verified eligibility',badge('Published 1.0.0','live')+btn('Inspect','inspect-offer'))}</div>`;
 case'U06':return toolEditor();
 case'U07':return explore();
 case'U08':return link('← Back to Features','U03')+head('Platform configurations','Shared conversation rules and recovery-policy behaviour.')+`<div class="panel flush">${row('Conversation core','Grounding and store-referral instructions',badge('Base','live')+btn('Open','platform-core'))}${row('Discount assistance','Available when the recovery offer policy permits it',badge('Recovery policy')+btn('Open','platform-discount'))}</div>${notice('These configurations do not create paid features or override merchant plan eligibility.')}`;
 case'U09':return behaviour();
 case'U10':return head('Releases','Review and publish a complete set of feature behaviour.',btn('Create release','create-release',true))+`<div class="panel"><span class="eyebrow">Active release</span><h2 style="margin-top:8px">Release ${state.activated?'13':'12'}</h2><p class="sub">Used when a new recovery conversation first receives its tools.</p>${link('Inspect release →','U11')}</div><div class="panel flush">${state.releaseCreated?row(link('Release 13','U11'),'Care advice · product details 1.0.0',badge(state.activated?'Active':'Ready to activate',state.activated?'live':'draft')+link('Review →','U11')):''}${row('Release 12','Product guidance and recovery-policy tools',badge(state.activated?'Previous':'Active',state.activated?'':'live')+btn('Review','release-previous'))}${row('Release 11','Previous published configuration',badge('Previous')+btn('Review rollback','rollback'))}</div>`;
 case'U11':return releaseReview();
 case'U12':return head('Merchants','Inspect effective feature eligibility and published tools.')+`<div class="searchline"><input aria-label="Search merchants" placeholder="Search by store name or domain" data-search="shops"></div><div class="panel flush" data-list="shops">${row(link('North & Field','U13'),'north-and-field.myshopify.com',badge('Growth plan')+link('Inspect →','U13'))}${row('Juniper Home','juniper-home.myshopify.com',badge('Starter plan')+btn('Inspect','merchant-demo'))}</div>`;
 case'U13':return merchant();
 case'U14':return preview();
 }
}
function toolEditor(){
 const labels=['Purpose','Inputs','Retrieve','Map inputs','Response','Review & test'];
 let inner='';
 if(state.tab==='Metadata') inner=`<div class="panel">${field('Display name','toolLabel',state.toolLabel)}<label>MCP name<input value="${esc(state.toolName)}" readonly></label>${field('Staff description','purpose',state.purpose,true)}${btn('Save metadata','save',true)}${notice('The MCP name is permanent. Agent-facing instructions belong to a version.')}<div class="actions">${btn('Disable tool','disable-tool')}</div></div>`;
 else if(state.tab==='History')inner=`<div class="panel flush">${row('Version 1.0.0',state.toolPublished?'Published · immutable':'Draft · editable',badge(state.toolPublished?'Published':'Draft',state.toolPublished?'live':'draft')+btn('Open version','open-version'))}</div><div class="panel"><h2>Used by</h2>${state.attached?link(esc(state.feature)+' →','U09'):'<span class="sub">Not yet attached to a published behaviour.</span>'}</div>`;
 else {
 let form='';
 switch(state.step){
 case 0:form=`${field('When should the agent use this tool?','purpose',state.purpose,true)}<div class="detailgrid"><label>Definition version<input value="1.0.0" readonly></label><label>Tool name<input value="${esc(state.toolName)}" readonly></label></div>${notice('Describe when this tool is useful and when the agent should refer the customer to the store.')}`;break;

nspect the granted tools, returned facts and response.</p>'}</div></div>`;

function modal(){
 let title='',content='',confirm='',label='Confirm';
 switch(state.modal){
 case'new-tool':title='Create reusable tool';content=field('Display name','toolLabel',state.toolLabel)+field('Permanent tool name','toolName',state.toolName);confirm='create-tool-confirm';label='Create tool';break;
 case'behaviour':title='Add behaviour to '+esc(state.feature);content=`<label>Capability key<input value="care_advice_assistant"></label><label>Display name<input value="${esc(state.feature)} assistant"></label>${notice('This configuration links to the existing Admin feature. It does not create a new feature.')}`;confirm='create-behaviour-confirm';label='Create behaviour';break;
 case'publish-tool':title='Publish tool version 1.0.0';content=`<p>${esc(state.toolLabel)}</p>${notice('The published definition becomes read-only. Features must explicitly attach this version.')}<label>Reason<input value="Initial care-advice tool"></label>`;confirm='publish-tool-confirm';label='Publish version';break;
 case'attach':title='Attach a published tool';content=`<div class="panel"><h3>${esc(state.toolLabel)}</h3><div class="actions">${badge('Published 1.0.0','live')}${badge('Public Shopify query')}</div></div>${notice('The exact version is pinned. Publishing a newer tool will not change this association.')}`;confirm='attach-confirm';label='Attach version 1.0.0';break;
 case'publish-behaviour':title='Publish behaviour revision';content=`<p>${esc(state.feature)} · revision 2</p>${notice('This freezes the prompt and tool versions. It does not activate a release.')}<label>Reason<input value="Care advice ready for release"></label>`;confirm='publish-behaviour-confirm';label='Publish revision';break;
 case'create-release':title='Create release 13';content=`<div class="panel flush">${row('Conversation core','Required base configuration',badge('Included'))}${row(esc(state.feature),'Revision 2 · product details 1.0.0',badge('New','live'))}</div>${notice('Preserves the other members of release 12. Creation does not activate the release.')}<label>Reason<input value="Add care-advice behaviour"></label>`;confirm='create-release-confirm';label='Create release';break;
 case'activate':title='Activate release 13';content=notice('New conversations receive this release. Existing conversations keep their original tools.')+'<label>Reason<input value="Enable published care advice"></label>';confirm='activate-confirm';label='Activate';break;
 case'rollback':title='Rollback to release 11';content=notice('Only the active release pointer changes. Existing grants and release history remain unchanged.')+'<label>Reason<input value="Restore previous configuration"></label>';confirm='rollback-confirm';label='Confirm rollback';break;
 case'unsaved':title='Unsaved changes';content='<p>Keep editing or discard changes made since the last save.</p>';confirm='discard';label='Discard changes';break;
 case'reset':title='Start a new preview conversation?';content=notice('The current synthetic conversation is abandoned. No live conversation is affected.');confirm='reset-confirm';label='Reset';break;
 default:title='Design detail';content=`<p>${esc(state.modalText||'This control represents the proposed workflow.')}</p>`;confirm='close-modal';label='Close';
 }
 return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${title}</h2>${content}<div class="actions">${btn(state.modal==='unsaved'?'Stay':'Cancel','cancel-modal')}${btn(label,confirm,true)}</div></div></div>`;

 root.style.setProperty('--st-radius',design.corners+'px');root.classList.toggle('compact',design.density==='Compact');

let busy=false;
root.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el||!root.contains(el)||busy||el.disabled)return;
 if(el.dataset.go){go(el.dataset.go);return;}
 const action=el.dataset.action;if(!action)return;
 busy=true;
 try{
 switch(action){
 case'view-map':state.view='map';break;case'view-studio':state.view='studio';break;case'start-flow':state.page='U03';state.view='studio';break;
 case'feature-care':state.feature='Care advice';go('U04');return;
 case'feature-product':state.feature='Product guidance';state.featureConfigured=true;go('U04');return;
 case'feature-size':state.feature='Size information';state.featureConfigured=true;go('U04');return;
 case'add-behaviour':state.modal='behaviour';break;
 case'create-behaviour-confirm':state.featureConfigured=true;state.modal=null;state.page='U09';banner('Behaviour created in prototype. Add instructions and tools.');break;
 case'new-tool':state.returnToBehaviour=false;state.modal='new-tool';break;
 case'create-from-behaviour':state.returnToBehaviour=true;state.modal='new-tool';break;
 case'create-tool-confirm':state.toolCreated=true;state.toolDraft=true;state.toolPublished=false;state.dirty=false;state.step=0;state.tab='Definition';state.page='U06';state.modal=null;banner('Sample tool created. Complete its definition.');break;
 case'next-step':state.step=Math.min(5,state.step+1);break;case'prev-step':state.step=Math.max(0,state.step-1);break;case'step':state.step=Number(el.dataset.step);break;
 case'tool-tab':state.tab=el.dataset.value;break;case'explore-tab':state.exploreTab=el.dataset.value;break;case'schema-tab':state.exploreTab='Schema and query builder';break;
 case'save':state.dirty=false;banner('Draft saved in prototype. No live data changed.');break;
 case'new-draft':state.toolPublished=false;state.toolDraft=true;state.step=0;banner('New sample draft opened; published history is unchanged.');break;
 case'browse':state.exploreTab='Schema and query builder';go('U07');return;
 case'use-query':state.queryPicked=true;state.validated=true;state.step=3;state.page='U06';state.dirty=true;banner('Query applied to the draft. Save to keep these changes.');break;
 case'validate':state.validated=true;banner('Sample definition validates against the illustrated schema.');break;
 case'publish-tool':if(!state.validated){banner('Validate the definition before publishing.');state.step=5;}else state.modal='publish-tool';break;
 case'publish-tool-confirm':state.toolPublished=true;state.dirty=false;state.modal=null;state.step=5;banner('Tool version published in prototype. Attach it to a behaviour next.');break;
 case'attach-return':state.featureConfigured=true;state.page='U09';state.modal='attach';break;
 case'attach':if(state.toolPublished)state.modal='attach';else{state.modal='info';state.modalText='Publish a tool version first. Open Tools → Read product details → Review & test to validate and publish it.';}break;
 case'attach-confirm':state.attached=true;state.dirty=true;state.modal=null;banner('Tool associated with this draft. Save the behaviour.');break;
 case'remove-tool':state.attached=false;state.dirty=true;break;
 case'publish-behaviour':state.modal='publish-behaviour';break;
 case'publish-behaviour-confirm':state.behaviourPublished=true;state.dirty=false;state.modal=null;banner('Behaviour revision published in prototype. Create a release next.');break;
 case'create-release':state.page='U10';state.modal='create-release';break;
 case'create-release-confirm':state.releaseCreated=true;state.modal=null;state.page='U11';state.rollback=false;banner('Release 13 created. Activation is a separate step.');break;
 case'activate':state.modal='activate';break;case'activate-confirm':state.activated=true;state.modal=null;banner('Release 13 activated in prototype for new conversations.');break;

 case'release-previous':state.rollback=true;state.page='U11';break;
 case'inspect-merchant':go('U13');return;
 case'test-tool':state.previewReturn='U06';state.previewMode='Tool test';go('U14');return;
 case'test-behaviour':state.previewReturn='U09';state.previewMode='Conversation';go('U14');return;
 case'test-release':state.previewReturn='U11';state.previewMode='Conversation';go('U14');return;
 case'test-merchant':state.previewReturn='U13';state.previewMode='Conversation';go('U14');return;
 case'preview-mode':state.previewMode=el.dataset.value;state.previewStarted=false;state.previewSent=false;break;
 case'start-preview':state.previewStarted=true;state.previewSent=state.previewMode==='Tool test';banner('Synthetic preview started. The tool grant is frozen.');break;

 case'sign-in':go('U03',true);return;case'sign-out':go('U01',true);return;

root.addEventListener('input',e=>{const key=e.target.dataset.bind;if(key){state[key]=e.target.value;if(!['message','inputValue'].includes(key)){state.dirty=true;state.validated=false;}}const search=e.target.dataset.search;if(search){const q=e.target.value.toLowerCase();body.querySelectorAll(`[data-list="${search}"]>.row`).forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));}});
